<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PML Snagging">
<meta name="theme-color" content="#0E0602">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<title>PML Snagging</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Montserrat:wght@600;700;800&display=swap');
:root{
  --ff:'DM Sans','Segoe UI',Tahoma,sans-serif;
  --ffh:'Montserrat','DM Sans','Segoe UI',sans-serif;
  --ffm:'DM Mono','Courier New',monospace;
  --black:#0E0602;--black2:#1d1510;
  --yellow:#FCBF2A;--yellow-deep:#E5A80F;--yellow-soft:#FFF6DC;
  --bg:#F5F3EE;--card:#fff;
  --ink:#1c1410;--muted:#6f675e;--border:#e4dfd5;
  --red:#C0392B;--amber:#d97706;--blue:#2563eb;--green:#15803d;
  --radius:14px;
  --shadow:0 1px 2px rgba(14,6,2,.06),0 6px 20px rgba(14,6,2,.06);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* top bar */
.topbar{background:var(--black);border-bottom:3px solid var(--yellow);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand img{height:24px;display:block}
.brand-sub{font-family:var(--ffh);font-weight:700;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--yellow);border-left:1px solid #4a3f36;padding-left:12px}
.crumbs{color:#bfb6aa;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.crumbs a{color:#f3efe8;text-decoration:none}
.crumbs a:hover{color:var(--yellow)}
.top-actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
.net{font:700 11px var(--ffh);padding:4px 9px;border-radius:99px;white-space:nowrap}
.net.off{background:#7c2d12;color:#fff}
.net.sync{background:#3b2f25;color:var(--yellow)}
.who{display:flex;align-items:center;gap:8px;color:#e9e3d9;font-size:12.5px;cursor:pointer;border:1px solid #4a3f36;border-radius:10px;padding:5px 10px;background:none;min-height:36px}
.who:hover{background:#2a201a}
.role{font:700 10px var(--ffh);text-transform:uppercase;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:var(--yellow);color:var(--black)}
.role.manager{background:#93c5fd}
.role.contractor{background:#d1d5db}
.menu{position:absolute;right:12px;top:calc(100% + 6px);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);min-width:220px;overflow:hidden;z-index:60}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;text-decoration:none;border:none;background:#fff;cursor:pointer;border-bottom:1px solid var(--border)}
.menu a:hover,.menu button:hover{background:var(--yellow-soft)}
.menu .mh{padding:12px 14px;border-bottom:3px solid var(--yellow);font-size:12px;color:var(--muted)}
.menu .mh b{display:block;color:var(--ink);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:none;border-radius:10px;font-family:var(--ffh);font-size:12.5px;font-weight:700;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-y{background:var(--yellow);color:var(--black)}
.btn-y:hover{background:var(--yellow-deep)}
.btn-dark{background:var(--black);color:#fff}
.btn-dark:hover{background:#2a201a}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:transparent;color:#e9e3d9;border:1px solid #4a3f36}
.btn-ghost:hover{background:#2a201a}
.btn-o{background:#fff;color:var(--ink);border:1.5px solid var(--border)}
.btn-o:hover{border-color:var(--black)}
.btn-danger{background:#fff;color:var(--red);border:1.5px solid #f3c4bf}
.btn-danger:hover{background:#fdecea}
.btn-sm{min-height:32px;padding:5px 10px;font-size:11.5px}
.btn.on{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.btn-block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

.main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:var(--ffh);font-size:22px;font-weight:800;letter-spacing:-.3px}
h2{font-family:var(--ffh);font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:#f1ede5;color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.ok{background:#dcfce7;color:#166534}
.chip.warn{background:#fef3c7;color:#92400e}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:6px 12px;font:700 12px var(--ffh);cursor:pointer;min-height:36px}
.pill.on{background:var(--black);color:#fff;border-color:var(--black)}
.pill b{color:var(--yellow-deep);margin-left:4px}
.pill.on b{color:var(--yellow)}

/* login */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--black);background-image:radial-gradient(700px 300px at 80% 0,rgba(252,191,42,.2),transparent)}
.auth-card{background:#fff;border-radius:18px;width:380px;max-width:100%;padding:26px 24px;border-top:5px solid var(--yellow);box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.auth-logo img{height:30px}
.auth-logo span{font:800 12px var(--ffh);letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.auth-card h1{font-size:20px}
.auth-msg{font-size:13px;padding:9px 11px;border-radius:9px;background:#fdecea;color:var(--red)}
.auth-msg.ok{background:#dcfce7;color:#166534}
.auth-foot{color:#8f8579;font-size:12px;margin-top:16px;text-align:center}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;align-self:center}

/* job cards */
.job-card{padding:16px 16px 14px;border-left:5px solid var(--yellow);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.job-card:hover{box-shadow:0 8px 28px rgba(14,6,2,.12)}
.job-card.done{border-left-color:var(--green);opacity:.85}
.job-card .ref{font-family:var(--ffm);font-size:11.5px;color:var(--muted)}
.job-card h3{font-family:var(--ffh);font-size:16px;font-weight:700}
.job-card .addr{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.inbox{margin-bottom:18px;border-left:5px solid var(--blue)}
.inbox .ih{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}

/* hero + tabs */
.hero{background:var(--black);background-image:radial-gradient(600px 200px at 90% 0,rgba(252,191,42,.18),transparent);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero .ref{font-family:var(--ffm);font-size:12px;color:var(--yellow)}
.hero h1{color:#fff;margin:2px 0}
.hero .addr{font-size:13px;color:#c9c0b4}
.hero .kpis{display:flex;gap:18px;margin-left:auto}
.kpi b{display:block;font-family:var(--ffh);font-size:22px;color:var(--yellow)}
.kpi span{font-size:11px;color:#c9c0b4;text-transform:uppercase;letter-spacing:1px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tab{padding:10px 14px;font-family:var(--ffh);font-weight:700;font-size:13px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--yellow)}

/* drawing cards */
.dwg-card{overflow:hidden;cursor:pointer}
.dwg-card .thumb{aspect-ratio:3/2;background:#fafaf7 center/contain no-repeat;border-bottom:1px solid var(--border);position:relative}
.dwg-card .thumb .lvl{position:absolute;top:8px;left:8px;background:var(--black);color:var(--yellow);font-family:var(--ffh);font-weight:700;font-size:11px;padding:4px 8px;border-radius:6px}
.dwg-card .body{padding:10px 12px;display:flex;align-items:center;gap:8px}
.dwg-card .body b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* viewer */
body.viewer-mode{overflow:hidden}
.vwrap{position:fixed;inset:0;top:var(--tb,56px);display:flex;flex-direction:column;background:#2b2621}
.vbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vbar select{height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 10px;background:#fff;max-width:230px}
.vbody{flex:1;display:flex;min-height:0;position:relative}
.viewer{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#3a342e}
.viewer.adding{cursor:crosshair}
.viewer.dragging{cursor:grabbing}
.viewer img.plan{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 10px 40px rgba(0,0,0,.4);background:#fff}
.vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e9e3d9;text-align:center;padding:30px;font-size:14px}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:30px;height:38px;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pin svg{display:block;width:30px;height:38px}
.pin span{position:absolute;top:5px;left:0;width:30px;text-align:center;font:700 11px var(--ffh);color:#fff}
.pin.sel{z-index:5;transform:translate(-50%,-100%) scale(1.3)}
.pin.dim{opacity:.25}
.zoom-ctl{position:absolute;right:12px;bottom:calc(12px + var(--safe-bottom));display:flex;flex-direction:column;gap:6px;z-index:4}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--yellow);color:var(--black);font:700 12.5px var(--ffh);padding:8px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:4;display:none;white-space:nowrap;pointer-events:none}
.hint.show{display:block}
.areas{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.area{position:absolute;border:2px solid var(--yellow);background:rgba(252,191,42,.15)}
.area span{position:absolute;left:-2px;bottom:100%;background:var(--yellow);color:var(--black);font:700 11px var(--ffh);padding:2px 6px;border-radius:5px 5px 0 0;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.area.sel{border-color:#e8590c;background:rgba(232,89,12,.2)}
.area.sel span{background:#e8590c;color:#fff}
.area.ghost{border-style:dashed;background:rgba(252,191,42,.25)}
.areas.faint .area{border-style:dashed;background:rgba(252,191,42,.07)}
.areas.faint .area span{opacity:.85}
.viewer.marking{cursor:crosshair}
.viewer.marking.panning{cursor:grab}
.apanel .dbody{gap:8px}
.arow{display:flex;gap:6px;align-items:center}
.arow input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:14px;min-height:40px}
.arow.sel input{border-color:#e8590c;box-shadow:0 0 0 3px rgba(232,89,12,.18)}
.arow input:focus{outline:none}
.legend{position:absolute;left:12px;bottom:calc(12px + var(--safe-bottom));background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap;z-index:4;max-width:calc(100% - 90px)}

/* drawer */
.drawer{width:400px;max-width:100%;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.dhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dhead .no{font:800 18px var(--ffh)}
.dbody{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.dfoot{padding:10px 14px;padding-bottom:calc(10px + var(--safe-bottom));border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.f label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px;min-height:42px}
.f textarea{min-height:72px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(252,191,42,.25)}
.f input:disabled{background:#f6f4ef}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;padding:8px 4px;font:700 11px var(--ffh);cursor:pointer;border-right:1px solid var(--border);min-height:40px}
.seg button:last-child{border-right:none}
.seg button.on{color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:78px;height:78px;border-radius:10px;background:#eee center/cover;position:relative;cursor:zoom-in}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--black);color:#fff;font-size:13px;cursor:pointer}
.ph-add{width:78px;height:78px;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;gap:2px;text-align:center}
.ph-add b{font-size:22px;line-height:1}
.meta{font-size:11.5px;color:var(--muted)}
.copied{display:flex;align-items:center;gap:8px;background:var(--yellow-soft);border:1px solid #f5dc97;border-radius:10px;padding:8px 10px;font-size:12.5px}
.copied .btn{margin-left:auto}
.box{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.box.blue{background:#eff6ff;border:1px solid #bfdbfe}
.box.green{background:#f0fdf4;border:1px solid #bbf7d0}
.box.red{background:#fef2f2;border:1px solid #fecaca}
.box.grey{background:#f7f5f0;border:1px solid var(--border)}
.box .t{font:800 12.5px var(--ffh)}
.box .q{background:#fff;border-radius:8px;padding:7px 9px;border-left:3px solid var(--yellow);white-space:pre-wrap}
.kvs{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:13px}
.kvs b{color:var(--muted);font-weight:600;font-size:12px}
.section-t{font:800 12px var(--ffh);text-transform:uppercase;letter-spacing:1px;color:var(--ink);border-top:1px solid var(--border);padding-top:12px}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{font-size:12.5px;padding-left:14px;border-left:2px solid var(--border);position:relative}
.tl::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.tl .when{font-size:11px;color:var(--muted)}
.tl .note{background:#f7f5f0;border-radius:6px;padding:5px 8px;margin-top:3px;white-space:pre-wrap}

/* lists */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 10px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px;border-bottom:2px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fbf9f4}
.tbl .no{font:700 13px var(--ffm);white-space:nowrap}
.tbl select,.tbl input[type=text]{border:1.5px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
.tbl-wrap{overflow-x:auto}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.pend{font-size:11px;color:var(--amber);font-weight:700}
.snag-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.snag-row:hover{background:#fbf9f4}
.snag-row:last-child{border-bottom:none}
.snag-row .n{font:800 14px var(--ffh);width:54px;flex-shrink:0}
.snag-row .b{flex:1;min-width:0}
.snag-row .b b{display:block;font-size:14px}
.group-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:#faf8f4;border-radius:var(--radius) var(--radius) 0 0}
.group-h h3{font:700 15px var(--ffh)}

/* library / contractor editor */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lib-card{padding:14px}
.lib-card .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lib-card .hd input{font:700 15px var(--ffh);border:1.5px solid transparent;border-radius:8px;padding:4px 6px;flex:1;min-width:0}
.lib-card .hd input:hover,.lib-card .hd input:focus{border-color:var(--border);outline:none}
.swatch{width:26px;height:26px;border-radius:7px;border:none;cursor:pointer;flex-shrink:0;padding:0}
.types{display:flex;flex-direction:column;gap:6px}
.type-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.type-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;min-width:0}
.person{border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.person input{border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;min-width:0;width:100%}
.person .acc{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px}
.x{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);flex-shrink:0}
.x:hover{color:var(--red);border-color:#f3c4bf}
.tradechecks{display:flex;flex-wrap:wrap;gap:6px}
.tradechecks label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;border:1.5px solid var(--border);cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.tradechecks input{width:auto;min-height:0}
.tradechecks label.on{background:var(--yellow-soft);border-color:var(--yellow)}

/* modal etc */
.modal-bg{position:fixed;inset:0;background:rgba(14,6,2,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:480px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{padding:16px 18px;border-bottom:3px solid var(--yellow);font:800 16px var(--ffh)}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

<body>
<header class="topbar" id="topbar" hidden>
  <a class="brand" href="#/"><img src="assets/logo-light.png" alt="PML"><span class="brand-sub">Snagging</span></a>
  <div class="crumbs" id="crumbs"></div>
  <div class="top-actions">
    <span class="net off" id="netOff" hidden title="No signal — your changes are saved on this device and upload automatically later">● Offline</span>
    <span class="net sync" id="netSync" hidden title="Changes saved on this device, uploading when there's signal">⏳ <span id="syncN"></span> to upload</span>
    <button class="who" id="who"><span class="nm" id="whoName"></span><span class="role" id="whoRole"></span></button>
  </div>
</header>
<div id="app"></div>
<div id="report"></div>

<script type="module">
import {
  auth, db, OWNER_EMAILS, onAuthStateChanged, signOut, pendingWrites, sendInvite, sendReminder, importDocs, setSessionRefresher, setRefusedHandler,
  collection, doc, query, where, onSnapshot, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch
} from './data.js';
import {
  returningFromSignIn, startSignInRequested, workosSignIn, finishSignIn, workosSignOut, refreshSession
} from './workos-auth.js';

/* ═════════════ helpers ═════════════ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const low=s=>String(s||'').trim().toLowerCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const STATUSES=[
  {k:'open',label:'Open',c:'#C0392B'},
  {k:'progress',label:'In progress',c:'#d97706'},
  {k:'ready',label:'Awaiting sign-off',c:'#2563eb'},
  {k:'closed',label:'Signed off',c:'#15803d'}];
const ST=Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const PRIORITIES=['Low','Medium','High'];
const ROLES={admin:'Admin',manager:'Site manager',contractor:'Contractor'};
const fmtDate=v=>{if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};
const fmtWhen=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});};
const today=()=>new Date().toISOString().slice(0,10);
// Building-by-building, then floor order (basement → lower ground → ground → 1st → … → roof), for reports.
const natCmp=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});
const WORDS={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12};
function floorRank(level){
  const t=low(level);if(!t)return 900;
  if(/roof/.test(t))return 800;
  const bm=t.match(/(?:basement|\bb)\s*-?\s*0*(\d+)/);if(bm)return -10-Number(bm[1]);
  if(/basement|cellar/.test(t))return -10;
  if(/lower\s*ground|\blg\b|\blgf\b/.test(t))return -1;
  if(/upper\s*ground|\bug\b|\bugf\b/.test(t))return .5;
  if(/ground|\bgf\b|^g$|^(level\s*)?0+$/.test(t))return 0;
  if(/mezz/.test(t))return .7;
  const n=t.match(/-?\d+/);if(n)return Number(n[0]);
  for(const [w,v] of Object.entries(WORDS))if(t.includes(w))return v;
  return 700;
}
const floorLabel=d=>[d?.building,d?.level].filter(Boolean).join(' – ');
// used as a <select> value, so only characters that survive HTML (a NUL separator gets changed by the browser)
const floorKey=d=>JSON.stringify([d?.building||'',d?.level||'']);
const dwgCmp=(a,b)=>natCmp(a.building,b.building)||floorRank(a.level)-floorRank(b.level)||natCmp(a.level,b.level)||(a.order||0)-(b.order||0);
const snagNo=n=>'S-'+String(n||0).padStart(3,'0');
const statusPill=k=>`<span class="status" style="background:${ST[k]?.c||'#888'}">${esc(ST[k]?.label||k)}</span>`;
const emailsOf=c=>[...new Set([c?.email,...(c?.people||[]).map(p=>p.email)].map(low).filter(Boolean))];
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),ms);}
function lightbox(url){const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${url}">`;d.onclick=()=>d.remove();document.body.append(d);}
// Writes are never awaited: offline they wait in a queue on the device and upload later.
const w=p=>{p&&p.catch&&p.catch(e=>{console.error(e);toast(e.code==='permission-denied'?"You don't have permission to change that":'Could not save: '+(e.code||e.message));});};

function modal(title,body,{ok='Save',danger=false,cancel='Cancel'}={}){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal"><div class="mh">${esc(title)}</div><div class="mb">${body}</div>
      <div class="mf">${cancel?`<button class="btn btn-o" data-x>${esc(cancel)}</button>`:''}<button class="btn ${danger?'btn-danger':'btn-y'}" data-ok>${esc(ok)}</button></div></div>`;
    const close=v=>{bg.remove();res(v);};
    bg.querySelector('[data-x]')?.addEventListener('click',()=>close(null));
    bg.onclick=e=>{if(e.target===bg)close(null);};
    bg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();bg.querySelector('[data-ok]').click();}});
    bg.querySelector('[data-ok]').onclick=()=>{const v={};bg.querySelectorAll('[name]').forEach(i=>v[i.name]=i.type==='checkbox'?i.checked:i.value);close(v);};
    document.body.append(bg);
    bg.querySelector('input,select,textarea')?.focus();
  });
}
const confirmBox=(t,msg,ok='Delete')=>modal(t,`<p>${msg}</p>`,{ok,danger:true});

async function fileToDataURL(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});}
function loadEl(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
async function scaleImage(src,max,q=.8){
  const img=typeof src==='string'?await loadEl(src):src;
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
  const s=Math.min(1,max/Math.max(W,H));
  const c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return{url:c.toDataURL('image/jpeg',q),w:c.width,h:c.height};
}
function pickFiles(accept,multiple=false){
  return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=multiple;i.onchange=()=>res([...i.files]);i.click();});
}

/* Small on-device cache for drawings (so they open offline and aren't downloaded again each time) */
const LC=(()=>{
  let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('pml-snag-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(m,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction('kv',m);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});};
  return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k))};
})();

/* ═════════════ state ═════════════ */
let ME=null;                 // {email,name,role,active}
let LIB={trades:[],contractors:[]};
let pendingLib=null,libTimer=null;
let JOBS=[],jobsLoaded=false;
const SNAGS={},DRAW={},USERS={};
const subs={snags:{},drawings:{}};
const isAdmin=()=>ME?.role==='admin';
const isStaff=()=>ME&&(ME.role==='admin'||ME.role==='manager');
const isCon=()=>ME?.role==='contractor';
const job=id=>JOBS.find(j=>j.id===id);
const trade=id=>LIB.trades.find(t=>t.id===id);
const snagsOf=id=>SNAGS[id]||[];
const findSnag=(jid,sid)=>snagsOf(jid).find(s=>s.id===sid);
const snagRef=(jid,sid)=>doc(db,'jobs',jid,'snags',sid);
const countBy=list=>{const o={open:0,progress:0,ready:0,closed:0};list.forEach(s=>o[s.status]=(o[s.status]||0)+1);return o;};

const DEFAULT_TRADES=[
  ['Painter & Decorator','#e11d48',['Paint peeling / flaking','Missed areas / patchy finish','Paint on fixtures or glass','Cracks not filled before painting','Runs or drips']],
  ['Bricklayer','#b45309',['Damaged / chipped brick','Mortar joints incomplete','Mortar staining on face','Cavity tray / weep vents missing','Brickwork out of plumb']],
  ['Dryliner / Plasterer','#7c3aed',['Board damaged','Poor joint finish','Screw pops','Uneven / wavy surface','Missing corner bead']],
  ['Fire Stopping','#dc2626',['Penetration not sealed','Incorrect product used','Missing ID label','Gap around fire damper','Batt damaged / incomplete']],
  ['Joiner','#0d9488',['Door not closing / latching','Frame damaged','Missing ironmongery','Skirting gaps','Architrave not fixed']],
  ['Electrician','#2563eb',['Missing faceplate','Socket / switch not level','Light fitting not working','Cable exposed']]];

/* ═════════════ refresh handling ═════════════ */
// Live updates re-draw the page, but never while someone is typing in a box.
let VIEW={};
let refreshQueued=false,refreshWaiting=false;
const typing=()=>{const a=document.activeElement;return a&&a.matches('input:not([type=checkbox]):not([type=color]),textarea')&&($('#app').contains(a));};
function bump(){
  if(refreshQueued)return;refreshQueued=true;
  setTimeout(()=>{refreshQueued=false;
    if(typing()){refreshWaiting=true;return;}
    if(pendingLib&&!libTimer){LIB=pendingLib;pendingLib=null;}
    VIEW.refresh?.();
  },30);
}
document.addEventListener('focusout',()=>{if(refreshWaiting){refreshWaiting=false;setTimeout(bump,50);}});

/* ═════════════ sign in ═════════════ */
function authScreen(inner){
  $('#topbar').hidden=true;document.body.classList.remove('viewer-mode','show-report');
  $('#app').innerHTML=`<div class="auth-wrap"><div style="width:380px;max-width:100%"><div class="auth-card">
    <div class="auth-logo"><img src="assets/logo-dark-print.png" alt="PML"><span>Snagging</span></div>${inner}</div>
    <div class="auth-foot">PML Fire Protection · Building Confidence.</div></div></div>`;
}
// Signing in happens on the WorkOS AuthKit page (email + password, forgotten password, codes etc.).
function showLogin(msg='',ok=false){
  authScreen(`<h1>Sign in</h1>
    ${msg?`<div class="auth-msg ${ok?'ok':''}">${esc(msg)}</div>`:''}
    <p style="font-size:14px">Use the email address PML gave access to.</p>
    <button class="btn btn-y btn-block" id="lGo">Sign in</button>
    <button class="linkbtn" id="lNew">First time? Create your login</button>`);
  const go=async signUp=>{
    if(!navigator.onLine){showLogin('No signal. You need signal the first time you sign in on a device.');return;}
    $('#lGo').disabled=true;$('#lGo').textContent='Opening sign-in…';
    try{await workosSignIn({signUp});}
    catch(err){showLogin('Could not open the sign-in page: '+(err.message||err));}
  };
  $('#lGo').onclick=()=>go(false);
  $('#lNew').onclick=()=>go(true);
}
function showNoAccess(email,disabled){
  authScreen(`<h1>${disabled?'Access switched off':'No access yet'}</h1>
    <p style="font-size:14px">${disabled?`The login for <b>${esc(email)}</b> has been switched off.`:`<b>${esc(email)}</b> is signed in, but hasn't been given access to PML Snagging.`} Please contact PML.</p>
    <button class="btn btn-o btn-block" id="naOut">Sign out</button>`);
  $('#naOut').onclick=doSignOut;
}
async function doSignOut(){
  // Signing out clears this device, so warn if some changes haven't uploaded yet.
  const n=pendingWrites();
  if(n&&!await confirmBox('Sign out?',`${n} change${n==1?' hasn\'t':'s haven\'t'} uploaded yet. If you sign out now ${n==1?'it':'they'} will be lost. Wait until you have signal to keep ${n==1?'it':'them'}.`,'Sign out anyway'))return;
  stopAll();authScreen('<p class="muted" style="text-align:center">Signing out…</p>');
  signingIn=null;
  await signOut(auth).catch(()=>{});
  if(!await workosSignOut())showLogin('Signed out.',true);
}

let meUnsub=null;
function stopAll(){
  meUnsub?.();meUnsub=null;
  subs.lib?.();subs.jobs?.();subs.users?.();subs.lib=subs.jobs=subs.users=null;
  Object.values(subs.snags).forEach(u=>u());Object.values(subs.drawings).forEach(u=>u());
  subs.snags={};subs.drawings={};
  for(const o of [SNAGS,DRAW,USERS])for(const k in o)delete o[k];
  JOBS=[];jobsLoaded=false;ME=null;VIEW.cleanup?.();VIEW={};
}
// Coming back from the AuthKit page: swap the WorkOS login for a PML Snagging session.
// AuthKit's "Sign-in endpoint" (…/?sign-in) starts a sign-in straight away, e.g. from an invitation email.
setSessionRefresher(refreshSession);
setRefusedHandler(e=>toast('A change made earlier was refused: '+(e.message||e.code),6000));
let signingIn=null;
const signingInScreen=()=>authScreen('<p class="muted" style="text-align:center">Signing you in…</p>');
if(returningFromSignIn){
  signingIn=finishSignIn().catch(err=>{
    if(!signingIn)return;
    const m={'not-verified':err.message,'no-email':err.message,'network':'No signal, or the sign-in service can\'t be reached. Try again when you have signal.'}[err.code]||err.message||String(err);
    signingIn=null;showLogin(m);
  }).finally(()=>{signingIn=null;});
}else if(startSignInRequested&&navigator.onLine){
  const t=new URLSearchParams(location.search).get('invitation_token')||undefined;
  history.replaceState({},'',location.pathname);
  signingIn=workosSignIn({invitationToken:t}).catch(()=>{signingIn=null;showLogin();});
}
onAuthStateChanged(auth,user=>{
  stopAll();
  if(!user){if(signingIn)signingInScreen();else showLogin();return;}
  startSession(user);
});
function startSession(user){
  stopAll();
  const email=low(user.uid);
  authScreen('<p class="muted" style="text-align:center">Loading…</p>');
  let slow=setTimeout(()=>{if(!ME)authScreen('<p style="text-align:center;font-size:14px">Still connecting… If you have no signal, this device needs to have been signed in with signal at least once.</p><button class="linkbtn" id="so">Sign out</button>'),$('#so')&&($('#so').onclick=doSignOut);},12000);
  meUnsub=onSnapshot(doc(db,'users',email),{includeMetadataChanges:true},snap=>{
    if(!snap.exists()){
      if(OWNER_EMAILS.map(low).includes(email)){
        w(setDoc(doc(db,'users',email),{email,name:user.displayName||email.split('@')[0],role:'admin',active:true,createdAt:Date.now()}));
        return;
      }
      if(snap.metadata.fromCache)return; // wait for the server before saying no
      clearTimeout(slow);showNoAccess(email);return;
    }
    clearTimeout(slow);
    const d=snap.data();
    if(!d.active){ME=null;showNoAccess(email,true);return;}
    const roleChanged=!ME||ME.role!==d.role;
    ME={...d,email};
    if(roleChanged)startData();else{drawTopbar();bump();}
  },err=>{clearTimeout(slow);console.error(err);authScreen(`<h1>Can't load your account</h1><p style="font-size:14px">${esc(err.code||err.message)}</p><button class="btn btn-o btn-block" id="so">Sign out</button>`);$('#so').onclick=doSignOut;});
}

/* ═════════════ live data ═════════════ */
function startData(){
  subs.lib?.();subs.jobs?.();subs.users?.();
  Object.values(subs.snags).forEach(u=>u());subs.snags={};
  JOBS=[];jobsLoaded=false;
  if(isStaff()){
    subs.lib=onSnapshot(doc(db,'settings','library'),snap=>{

function syncSnagSubs(){

async function prefetchDrawings(jid){

  if(prefetching||!navigator.onLine)return;prefetching=true;

const dwgMem={};
async function loadDrawing(jid,d){
  const key=`dwg:${d.id}:${d.v||1}`;
  if(dwgMem[key])return dwgMem[key];
  let url=await LC.get(key).catch(()=>null);
  if(!url){
    const snap=await getDocs(collection(db,'jobs',jid,'drawings',d.id,'chunks'));
    const parts=snap.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);
    if(!parts.length||parts.length<(d.chunks||1))throw new Error('not-downloaded');
    url=parts.map(p=>p.d).join('');
    LC.set(key,url).catch(()=>{});
  }

}

async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=rej;document.head.append(s);});
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return pdfjsLib;
}
async function uploadDrawing(j){
  const [f]=await pickFiles('image/*,application/pdf');if(!f)return;
  const base=f.name.replace(/\.[^.]+$/,'');
  const v=await drawingForm(base,'','',j.id);if(!v)return;
  toast('Processing drawing…');
  try{
    const pages=[];
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      const lib=await loadPdfJs();
      const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1});
        const sc=Math.min(3600/Math.max(vp0.width,vp0.height),6),vp=pg.getViewport({scale:sc});
        const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:x,viewport:vp}).promise;
        pages.push(c);
      }
    }else pages.push(await loadEl(await fileToDataURL(f)));
    const existing=(DRAW[j.id]||[]).length,ids=[];
    for(const [i,src] of pages.entries()){
      const full=await scaleImage(src,3600,.8),thumb=await scaleImage(src,480,.7);
      ids.push(saveDrawing(j.id,{name:(v.name||base)+(pages.length>1?` – p${i+1}`:''),level:v.level,building:v.building.trim(),url:full.url,w:full.w,h:full.h,thumb:thumb.url,order:Date.now()+existing+i}));
    }
    // straight on to marking out the rooms/areas, so new snags can pick up their location
    if(isAdmin()){location.hash=`#/job/${j.id}/areas/${ids[0]}`;toast((pages.length>1?`${pages.length} drawings added`:'Drawing added')+' — now drag over each room and name it',4000);}
    else toast(pages.length>1?`${pages.length} drawings added`:'Drawing added');
  }catch(e){console.error(e);toast(navigator.onLine?'Could not read that file':'PDFs need signal the first time — or upload a JPG/PNG');}
}
function saveDrawing(jid,{name,level,building='',url,w:W,h:H,thumb,order}){
  // The drawing is uploaded in ~900KB pieces so each upload stays a sensible size on site signal.
  const ref=doc(collection(db,'jobs',jid,'drawings'));
  const size=900000,n=Math.ceil(url.length/size);
  let b=writeBatch(db),cnt=0;
  for(let i=0;i<n;i++){b.set(doc(db,'jobs',jid,'drawings',ref.id,'chunks',String(i)),{i,d:url.slice(i*size,(i+1)*size)});if(++cnt===5){w(b.commit());b=writeBatch(db);cnt=0;}}
  b.set(ref,{name,level,building,w:W,h:H,thumb,chunks:n,v:1,order,createdAt:Date.now(),createdBy:ME.email});
  w(b.commit());
  dwgMem[`dwg:${ref.id}:1`]=url;LC.set(`dwg:${ref.id}:1`,url).catch(()=>{});
  return ref.id;
}

  clearTimeout(jobSaveT[j.id]);
  jobSaveT[j.id]=setTimeout(()=>{
    delete jobSaveT[j.id];
    const contractors=clone(j.contractors||[]);
    const all=[...new Set(contractors.flatMap(emailsOf))];
    w(updateDoc(doc(db,'jobs',j.id),{contractors,contractorEmails:all}));
    // keep each snag's "who can see this" list in step with the contractor's emails
    const byId=Object.fromEntries(contractors.map(c=>[c.id,c]));
    const b=writeBatch(db);let n=0;
    snagsOf(j.id).forEach(s=>{const c=byId[s.contractorId];if(!c)return;const em=emailsOf(c);
      if(JSON.stringify(em)!==JSON.stringify(s.contractorEmails||[])||c.company!==s.contractorName){b.update(snagRef(j.id,s.id),{contractorEmails:em,contractorName:c.company});n++;}});
    if(n)w(b.commit());
  },600);
}
function saveLib(now){
  clearTimeout(libTimer);
  const go=()=>{libTimer=null;w(setDoc(doc(db,'settings','library'),clone(LIB)));};
  if(now)go();else libTimer=setTimeout(go,600);
}

function accessBadge(email,name){
  email=low(email);if(!email)return'';
  const u=USERS[email];
  if(u)return u.active?`<span class="chip ok">✓ Has access (${esc(ROLES[u.role]||u.role)})</span>`:`<span class="chip warn">Access switched off</span>`;
  return `<span class="chip">No login yet</span><button class="btn btn-o btn-sm" data-invite="${esc(email)}" data-name="${esc(name||'')}">Give app access</button>`;
}
async function invite(email,name,role='contractor',ask=true){
  email=low(email);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('That email address doesn\'t look right');return false;}
  if(!navigator.onLine){toast('You need signal to give app access');return false;}
  if(ask&&!await modal('Give app access',`<p>Give <b>${esc(email)}</b> <b>${esc(ROLES[role])}</b> access?</p><p class="meta">They'll get an email invitation to create their PML Snagging login. ${role==='contractor'?'They will only see snags assigned to their company on jobs where this email is listed.':''}</p>`,{ok:'Give access & send invite'}))return false;
  try{await setDoc(doc(db,'users',email),{email,name:name||email.split('@')[0],role,active:true,createdAt:Date.now(),createdBy:ME.email});}
  catch(e){toast('Could not give access: '+(e.code||e.message),5000);return false;}
  await emailInvite(email);
  return true;
}
// Sends (or resends) the WorkOS invitation email. Access itself comes from the users/{email} record,
// so even if the email fails they can sign up themselves with that address.
async function emailInvite(email){
  if(!navigator.onLine){toast('You need signal to send an invite');return;}
  try{
    const s=await sendInvite(email);
    toast(s==='has-login'?`${email} already has a login — they can sign in now`:`Invite ${s==='resent'?'sent again':'sent'} to ${email}`,4500);
  }catch(e){toast(`Couldn't email the invite (${e.message}). They can still tap "Create your login" in the app using ${email}.`,7000);}
}

let myFilter='todo';
function viewMySnags(onlyJob){
  VIEW.refresh=draw;draw();
  function draw(){
    setCrumbs(onlyJob&&job(onlyJob)?[['My snags','#/'],[job(onlyJob).name]]:[['My snags']]);
    const jobs=JOBS.filter(j=>!onlyJob||j.id===onlyJob);
    const all=jobs.flatMap(j=>snagsOf(j.id));
    const groups={todo:s=>s.status==='open'||s.status==='progress',ready:s=>s.status==='ready',closed:s=>s.status==='closed',all:()=>true};
    const n=k=>all.filter(groups[k]).length;
    $('#app').innerHTML=`<div class="main">
      <div class="page-head"><div><h1>My snags</h1><p class="muted">Snags assigned to you by PML. Tap one to see where it is and update it.</p></div></div>
      <div class="pills">${[['todo','To do'],['ready','Waiting for PML sign-off'],['closed','Signed off'],['all','All']].map(([k,t])=>`<button class="pill ${myFilter===k?'on':''}" data-f="${k}">${t}<b>${n(k)}</b></button>`).join('')}</div>
      <div id="groups" style="display:flex;flex-direction:column;gap:14px"></div></div>`;
    document.querySelectorAll('.pill[data-f]').forEach(b=>b.onclick=()=>{myFilter=b.dataset.f;draw();});
    const host=$('#groups');
    if(!jobsLoaded){host.innerHTML='<div class="empty card">Loading…</div>';return;}
    if(!jobs.length){host.innerHTML='<div class="empty card"><b>Nothing assigned to you yet</b>When PML assigns snags to you they appear here.</div>';return;}
    let shown=0;
    jobs.forEach(j=>{
      const list=snagsOf(j.id).filter(groups[myFilter]).sort((a,b)=>a.no-b.no);
      if(!list.length)return;shown++;
      ensureDrawings(j.id);

const areasOf=(jid,dwgId)=>(DRAW[jid]||[]).find(x=>x.id===dwgId)?.areas||[];
// smallest box wins, so a room marked inside a bigger zone takes priority
const areaAt=(areas,x,y)=>areas.filter(a=>x>=a.x&&x<=a.x+a.w&&y>=a.y&&y<=a.y+a.h).sort((a,b)=>a.w*a.h-b.w*b.h)[0]||null;
function areaBoxes(el,areas,{tx,ty,s,W,H},selId){
  el.innerHTML=areas.map(a=>`<div class="area${a.id===selId?' sel':''}${a.ghost?' ghost':''}" style="left:${tx+a.x*W*s}px;top:${ty+a.y*H*s}px;width:${a.w*W*s}px;height:${a.h*H*s}px">${a.name?`<span>${esc(a.name)}</span>`:''}</div>`).join('');
}

  const zoomAt=(f,cx,cy)=>{const ns=Math.max(minS,Math.min(maxS,s*f));tx=cx-(cx-tx)*(ns/s);ty=cy-(cy-ty)*(ns/s);s=ns;apply();};

    const a={id:Math.random().toString(36).slice(2,10),name:v.n.trim(),x:r(g.x),y:r(g.y),w:r(g.w),h:r(g.h)};

  // pointer handling: drag to mark an area (or pan, in pan mode / holding Space), two fingers to pinch and move, wheel to zoom
  const pts=new Map();let start=null,pinch=null;

      if(!start.moved)return;

      else if(ready){const a=toPlan(start.x,start.y),b=toPlan(cur.x,cur.y);ghost={id:'_',ghost:true,x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};drawBoxes();}
    }else if(pts.size===2&&pinch){
      const m=mid(),r=viewer.getBoundingClientRect();
      tx+=m.x-pinch.x;ty+=m.y-pinch.y;
      zoomAt(m.d/pinch.d,m.x-r.left,m.y-r.top);pinch=m;
    }
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;
    pts.delete(e.pointerId);viewer.classList.remove('dragging');
    if(pts.size<2)pinch=null;
    if(pts.size===0&&start){
      if(ghost){if(ghost.w*W*s>12&&ghost.h*H*s>12)addArea(ghost);else{ghost=null;drawBoxes();}}
      else if(!start.moved&&ready){const p=toPlan(e.clientX,e.clientY),a=areaAt(areas,p.x,p.y);if(a)pick(a.id);else if(sel){sel=null;drawAll();}}
      start=null;
    }
  };
  viewer.addEventListener('pointerup',up);viewer.addEventListener('pointercancel',up);
  viewer.addEventListener('wheel',e=>{e.preventDefault();const r=viewer.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});

  setCursor();drawPanel();fit();
}

    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};start&&(start.moved=true);}

/* snag writes */
function patch(sn,obj){
  Object.assign(sn,obj);
  const cur=findSnag(sn.jobId,sn.id);if(cur&&cur!==sn)Object.assign(cur,obj);
  w(updateDoc(snagRef(sn.jobId,sn.id),{...obj,updatedAt:Date.now(),updatedBy:ME.email}));
}
const debT={};
function debounced(sn,k,v){
  const key=sn.id+k;sn[k]=v;
  clearTimeout(debT[key]?.t);
  debT[key]={t:setTimeout(()=>{delete debT[key];patch(sn,{[k]:v});},500),run:()=>patch(sn,{[k]:v})};
}
function flushDebounce(sn){for(const k of Object.keys(debT))if(k.startsWith(sn.id)){clearTimeout(debT[k].t);debT[k].run();delete debT[k];}}
addEventListener('pagehide',()=>{for(const k of Object.keys(debT)){clearTimeout(debT[k].t);debT[k].run();delete debT[k];}});

/* ═════════════ reports ═════════════ */
const RF={contractor:'',level:'',location:'',status:'notclosed',photos:true,overview:true,sections:true};
const locKey=s=>String(s||'').trim().toLowerCase();
function tabReports(j){
  const b=$('#tabBody');
  const cons=j.contractors||[];
  const dwgs=DRAW[j.id]||[],dmap=Object.fromEntries(dwgs.map(d=>[d.id,d]));
  const lvlOf=s=>floorKey(dmap[s.drawingId]);
  const all=snagsOf(j.id);
  const rows=cons.map(c=>{const l=all.filter(s=>s.contractorId===c.id);return{c,all:l.length,open:l.filter(s=>s.status==='open'||s.status==='progress').length,ready:l.filter(s=>s.status==='ready').length};}).filter(x=>x.all);
  // one row per floor + location, since copied areas share names across floors
  const groups=new Map();
  for(const s of all){
    const k=lvlOf(s)+'\u0000'+locKey(s.location);
    if(!groups.has(k))groups.set(k,{level:lvlOf(s),d:dmap[s.drawingId]||{},location:String(s.location||'').trim(),list:[]});
    groups.get(k).list.push(s);
  }
  const locRows=[...groups.values()].sort((a,b)=>dwgCmp(a.d,b.d)||natCmp(a.location||'~',b.location||'~'));
  // one option per building + floor, in building then floor order
  const floors=[];[...dwgs].sort(dwgCmp).forEach(d=>{if((d.building||d.level)&&!floors.some(f=>f.k===floorKey(d)))floors.push({k:floorKey(d),t:floorLabel(d)});});
  b.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <h2>Generate a report</h2>
      <div class="f"><label>Contractor</label><select id="rc"><option value="">All contractors (full job report)</option>${cons.map(c=>`<option value="${c.id}">${esc(c.company)}</option>`).join('')}</select></div>
      <div class="f2"><div class="f"><label>Building / floor</label><select id="rl"><option value="">All floors</option>${floors.map(f=>`<option value="${esc(f.k)}">${esc(f.t)}</option>`).join('')}</select></div>
        <div class="f"><label>Location / area</label><select id="rloc"></select></div></div>
      <div class="f"><label>Which snags</label><select id="rs"><option value="notclosed">Outstanding (not signed off)</option><option value="">All snags</option>${STATUSES.map(s=>`<option value="${s.k}">${s.label} only</option>`).join('')}</select></div>
      <label class="row" style="font-size:13px"><input type="checkbox" id="rsec"> Split into sections, building by building and floor by floor</label>
      <label class="row" style="font-size:13px"><input type="checkbox" id="ro"> Include drawing overview (every pin on each level)</label>
      <label class="row" style="font-size:13px"><input type="checkbox" id="rp"> Include photos</label>
      <button class="btn btn-y" id="gen">📄 Generate report</button>
    </div>
    <div class="card" style="padding:16px"><h2 style="margin-bottom:10px">By contractor</h2>
      ${rows.length?`<table class="tbl"><thead><tr><th>Contractor</th><th>Open</th><th>To sign off</th><th>Total</th><th></th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td><b>${esc(x.c.company)}</b></td><td>${x.open}</td><td>${x.ready}</td><td>${x.all}</td><td><button class="btn btn-o btn-sm" data-c="${x.c.id}">Report</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">No snags assigned yet.</p>'}
    </div>
    <div class="card" style="padding:16px;grid-column:1/-1"><h2 style="margin-bottom:10px">By location</h2>
      ${locRows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Building / floor</th><th>Location</th><th>Contractors</th><th>Open</th><th>To sign off</th><th>Total</th><th></th></tr></thead><tbody>
      ${locRows.map((x,i)=>{const names=[...new Set(x.list.map(s=>s.contractorName).filter(Boolean))];
        return`<tr><td>${esc(floorLabel(x.d)||'—')}</td><td><b>${esc(x.location||'No location set')}</b></td><td>${names.length?esc(names.join(', ')):'<span class="muted">Not assigned</span>'}</td>
        <td>${x.list.filter(s=>s.status==='open'||s.status==='progress').length}</td><td>${x.list.filter(s=>s.status==='ready').length}</td><td>${x.list.length}</td>
        <td>${x.location?`<button class="btn btn-o btn-sm" data-l="${i}">Report</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">No snags yet.</p>'}
    </div></div>`;
  const fillLoc=()=>{
    // locations on the chosen floor: from snags and from the areas marked on its drawings
    const onLvl=d=>!$('#rl').value||floorKey(d)===$('#rl').value;
    const names=new Map();
    all.filter(s=>dmap[s.drawingId]&&onLvl(dmap[s.drawingId])).forEach(s=>{const n=String(s.location||'').trim();if(n&&!names.has(locKey(n)))names.set(locKey(n),n);});
    dwgs.filter(onLvl).forEach(d=>(d.areas||[]).forEach(a=>{if(!names.has(locKey(a.name)))names.set(locKey(a.name),a.name);}));
    const cur=$('#rloc').value||RF.location;
    $('#rloc').innerHTML=`<option value="">All locations</option>${[...names.values()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(n=>`<option>${esc(n)}</option>`).join('')}`;
    $('#rloc').value=[...names.values()].find(n=>locKey(n)===locKey(cur))||'';
  };
  $('#rc').value=RF.contractor;if($('#rc').value!==RF.contractor)RF.contractor='';
  $('#rl').value=RF.level;if($('#rl').value!==RF.level)RF.level='';
  fillLoc();$('#rl').onchange=fillLoc;
  $('#rs').value=RF.status;$('#ro').checked=RF.overview;$('#rp').checked=RF.photos;$('#rsec').checked=RF.sections;
  const read=()=>{RF.contractor=$('#rc').value;RF.level=$('#rl').value;RF.location=$('#rloc').value;RF.status=$('#rs').value;RF.overview=$('#ro').checked;RF.photos=$('#rp').checked;RF.sections=$('#rsec').checked;};
  const go=()=>{
    const con=cons.find(c=>c.id===RF.contractor);
    const list=all.filter(s=>(!con||s.contractorId===con.id)&&(!RF.level||lvlOf(s)===RF.level)&&(!RF.location||locKey(s.location)===locKey(RF.location))
      &&(!RF.status||(RF.status==='notclosed'?s.status!=='closed':s.status===RF.status))).sort((a,b)=>a.no-b.no);
    buildReport(j,list,{con,level:floorLabel(dwgs.find(d=>floorKey(d)===RF.level)),location:RF.location,photos:RF.photos,overview:RF.overview,sections:RF.sections,scope:RF.status==='notclosed'?'Outstanding (not signed off)':RF.status?ST[RF.status].label+' only':'All'});
  };
  $('#gen').onclick=()=>{read();go();};
  b.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{read();Object.assign(RF,{contractor:x.dataset.c,level:'',location:''});go();});
  b.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{read();const r=locRows[x.dataset.l];Object.assign(RF,{contractor:'',level:r.level,location:r.location});go();});
}
function drawPinOnCanvas(ctx,x,y,label,color,scale=1){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-4,-10,-13,-17,-13,-25);ctx.arc(0,-25,13,Math.PI,0);ctx.bezierCurveTo(13,-17,4,-10,0,0);
  ctx.fillStyle=color;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,-25);
  ctx.restore();
}
async function snippet(im,sn){
  const W=im.naturalWidth,H=im.naturalHeight,cw=640,ch=440;
  const sw=Math.min(W,Math.max(W*.22,700)),sh=sw*ch/cw;
  let sx=sn.x*W-sw/2,sy=sn.y*H-sh/2;sx=Math.max(0,Math.min(W-sw,sx));sy=Math.max(0,Math.min(H-sh,sy));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
  const px=(sn.x*W-sx)*cw/sw,py=(sn.y*H-sy)*ch/sh;
  x.beginPath();x.arc(px,py,46,0,Math.PI*2);x.strokeStyle='rgba(252,191,42,.95)';x.lineWidth=7;x.stroke();
  drawPinOnCanvas(x,px,py,String(sn.no),ST[sn.status].c,2.3);
  return c.toDataURL('image/jpeg',.85);
}
function overview(im,list){
  const cw=1400,sc=cw/im.naturalWidth,ch=Math.round(im.naturalHeight*sc);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);
  list.forEach(sn=>drawPinOnCanvas(x,sn.x*cw,sn.y*ch,String(sn.no),ST[sn.status].c,1.1));
  return c.toDataURL('image/jpeg',.85);
}
async function buildReport(j,list,{con,level='',location='',photos=true,overview:ov=true,sections=true,scope='',title='Snagging Report'}={}){
  if(!list.length){toast('No snags match those options');return;}
  ensureDrawings(j.id);
  if(!DRAW[j.id]){toast('Drawings still loading — try again in a moment');return;}
  toast('Building report…');
  const dmap=Object.fromEntries(DRAW[j.id].map(d=>[d.id,d]));
  // building by building, floor by floor, then location, then snag number
  list=[...list].sort((a,b)=>dwgCmp(dmap[a.drawingId]||{},dmap[b.drawingId]||{})||natCmp(low(a.location)||'~',low(b.location)||'~')||a.no-b.no);
  const secOf=s=>floorLabel(dmap[s.drawingId])||'Floor not set';
  const multiSec=sections&&new Set(list.map(secOf)).size>1;
  const hasBldg=list.some(s=>dmap[s.drawingId]?.building);
  const ims={};
  for(const id of new Set(list.map(s=>s.drawingId))){const d=dmap[id];if(!d)continue;try{ims[id]=await loadEl(await loadDrawing(j.id,d));}catch{}}
  const c=countBy(list);
  const conName=con?.company||(isCon()?[...new Set(list.map(s=>s.contractorName))].join(', '):'All contractors');
  const contact=con?[con.phone,con.email].filter(Boolean).join(' · '):'';
  const where=[level,location].filter(Boolean).join(' – ');
  // who's responsible for what, when the report covers more than one contractor
  const byCon=con||isCon()?[]:[...new Set(list.map(s=>s.contractorId||''))].map(id=>{const l=list.filter(s=>(s.contractorId||'')===id),k=(j.contractors||[]).find(c=>c.id===id);
    return{name:k?.company||l[0].contractorName||'Not assigned',contact:k?[k.phone,k.email].filter(Boolean).join(' · '):'',c:countBy(l),n:l.length};}).sort((a,b)=>a.name.localeCompare(b.name));
  let html=`<div class="rbar"><button class="btn btn-ghost btn-sm" id="rback">← Back</button><b style="font-family:var(--ffh)">${esc(title)}</b><span class="spacer"></span><button class="btn btn-y" id="rprint">🖨 Print / Save as PDF</button></div>
  <div class="sheet">
    <div class="r-head"><img src="assets/logo-dark-print.png" alt="PML"><div><div class="t">${esc(title)}</div><div class="s">${esc(conName)}</div></div>
      <div class="d">Report date<br><b>${fmtDate(Date.now())}</b></div></div>
    ${where?`<div class="r-where">${level?`<div class="fl">${esc(level)}</div>`:''}${location?`<div class="lc">${esc(location)}</div>`:''}</div>`:''}
    <div class="r-info">
      <div><b>Job</b>${esc(j.name)}</div><div><b>Job ref</b>${esc(j.ref||'—')}</div>
      <div><b>Site address</b>${esc(j.address||'—')}</div><div><b>Client / main contractor</b>${esc(j.client||'—')}</div>
      <div><b>Contractor</b>${esc(conName)}</div><div><b>Contact</b>${esc(contact||'—')}</div>
      ${where?`<div><b>Building / floor</b>${esc(level||'All floors')}</div><div><b>Location</b>${esc(location||'All locations')}</div>`:''}
      <div><b>Snags included</b>${esc(scope||'As listed')}</div><div><b>Total in report</b>${list.length}</div>
    </div>
    <div class="r-sum">${STATUSES.map(s=>`<div style="border-top-color:${s.c}"><b>${c[s.k]}</b><span>${s.label}</span></div>`).join('')}</div>
    ${byCon.length?`<div class="r-h2">Contractors</div>
    <table class="r-tbl"><thead><tr><th>Contractor</th><th>Contact</th>${STATUSES.map(s=>`<th>${s.label}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${byCon.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contact||'—')}</td>${STATUSES.map(s=>`<td>${x.c[s.k]||0}</td>`).join('')}<td><b>${x.n}</b></td></tr>`).join('')}</tbody></table>`:''}
    <div class="r-h2">Snag summary</div>
    <table class="r-tbl"><thead><tr><th>No.</th><th>Defect</th>${con?'':'<th>Contractor</th>'}${hasBldg?'<th>Building</th>':''}<th>Level</th><th>Location</th><th>Responsible</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead><tbody>
    ${list.map((s,i)=>`${multiSec&&(i===0||secOf(s)!==secOf(list[i-1]))?`<tr class="r-sec"><td colspan="${8+(con?0:1)+(hasBldg?1:0)}">${esc(secOf(s))} · ${list.filter(x=>secOf(x)===secOf(s)).length} snag${list.filter(x=>secOf(x)===secOf(s)).length==1?'':'s'}</td></tr>`:''}<tr><td><b>${snagNo(s.no)}</b></td><td>${esc(s.type||'—')}</td>${con?'':`<td>${esc(s.contractorName||'—')}</td>`}${hasBldg?`<td>${esc(dmap[s.drawingId]?.building||'')}</td>`:''}<td>${esc(dmap[s.drawingId]?.level||'')}</td><td>${esc(s.location||'')}</td><td>${esc(s.personName||'—')}</td><td>${esc(s.priority||'')}</td><td>${fmtDate(s.due)}</td><td>${esc(ST[s.status]?.label||s.status)}</td></tr>`).join('')}
    </tbody></table>`;
  if(ov){
    html+=`<div class="r-h2" style="break-before:page">Drawing overview</div>`;
    for(const d of [...DRAW[j.id]].sort(dwgCmp)){const l=list.filter(s=>s.drawingId===d.id);if(!l.length||!ims[d.id])continue;
      html+=`<div class="r-ov"><img src="${overview(ims[d.id],l)}"><div class="cap"><b>${esc(d.level||'')}</b> — ${esc(d.name)} · ${l.length} snag${l.length==1?'':'s'}: ${l.map(s=>snagNo(s.no)).join(', ')}</div></div>`;}
  }
  html+=`<div class="r-h2" style="break-before:page">Snag details</div>`;
  for(const [i,s] of list.entries()){
    const d=dmap[s.drawingId]||{};
    if(multiSec&&(i===0||secOf(s)!==secOf(list[i-1])))html+=`<div class="r-h3">${esc(secOf(s))}</div>`;
    let pics=[];
    if(photos){try{pics=(await getDocs(collection(db,'jobs',j.id,'snags',s.id,'photos'))).docs.map(x=>x.data()).sort((a,b)=>(a.at||0)-(b.at||0));}catch{}}
    html+=`<div class="r-snag"><div class="sh"><span class="n">${snagNo(s.no)}</span><span class="ty">${esc(s.type||'—')}</span><span class="status" style="background:${ST[s.status]?.c}">${ST[s.status]?.label}</span></div>
      <div class="sb">${ims[s.drawingId]?`<img src="${await snippet(ims[s.drawingId],s)}" alt="Location on drawing">`:'<div class="meta">Drawing not available offline</div>'}
        <div class="kv"><b>Trade</b><span>${esc(s.tradeName||'—')}</span><b>Contractor</b><span>${esc(s.contractorName||'—')}</span>
        <b>Responsible</b><span>${esc(s.personName||'—')}</span>${d.building?`<b>Building</b><span>${esc(d.building)}</span>`:''}<b>Floor / level</b><span>${esc(d.level||'—')}</span><b>Drawing</b><span>${esc(d.name||'—')}</span>
        <b>Location</b><span>${esc(s.location||'—')}</span><b>Priority</b><span>${esc(s.priority||'—')}</span><b>Raised / due</b><span>${fmtDate(s.createdAt)} → ${fmtDate(s.due)}</span>
        ${s.status==='closed'?`<b>Signed off</b><span>${esc(s.signedOffByName||'')} · ${fmtDate(s.signedOffAt)}</span>`:''}
        ${s.desc?`<div class="desc">${esc(s.desc)}</div>`:''}
        ${s.contractorNote?`<div class="desc c"><b>Contractor:</b> ${esc(s.contractorNote)}</div>`:''}</div></div>
      ${pics.length?`<div class="rp">${pics.map(p=>`<figure><img src="${p.d}"><figcaption>${p.kind==='fix'?'Completed work':'Snag'}</figcaption></figure>`).join('')}</div>`:''}</div>`;
  }
  html+=`<div class="r-sign"><div>Contractor signature / date</div><div>Inspected by (PML) / date</div></div>
    <div class="r-foot"><span>PML Fire Protection · Building Confidence.</span><span>${esc(j.ref||'')} · generated ${new Date().toLocaleString('en-GB')}</span></div></div>`;
  const r=$('#report');r.innerHTML=html;
  document.body.classList.add('show-report');window.scrollTo(0,0);
  $('#rback').onclick=()=>{document.body.classList.remove('show-report');r.innerHTML='';};
  $('#rprint').onclick=()=>window.print();
}
